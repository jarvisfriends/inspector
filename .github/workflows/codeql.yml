name: CodeQL

# Advanced-setup CodeQL, replacing GitHub's default setup. Default setup's Go
# autobuild can no longer build this repo now that release tooling lives in a
# nested module (tools/releasetag), so Go uses manual build mode with the same
# build steps CI runs. Default setup must be DISABLED in Settings → Advanced
# Security → Code scanning before this workflow's uploads are accepted.

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Quality queries included so the separate default-setup "Code
          # Quality" analysis is covered here too.
          queries: security-and-quality
      - name: Build (root and nested tool modules)
        if: matrix.build-mode == 'manual'
        # Mirrors ci.yml's Verify job: the root module plus each nested
        # tools module, built explicitly so CodeQL traces every binary.
        run: |
          go build ./...
          go -C tools/releasetag build ./...
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"
